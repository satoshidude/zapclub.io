<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Turntable favicon for all devices: SVG (modern), PNG fallback, Apple touch icon
         (iOS home screen), and the web manifest (Android/PWA install). -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#0b0a10" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <script>
      /* Reset any pinch-zoom to scale=1 on every page load — keeps the PWA tight in the display. */
      ;(function () {
        var vp = document.querySelector('meta[name="viewport"]')
        if (!vp) return
        var base = vp.content
        vp.content = base + ', maximum-scale=1.0'
        setTimeout(function () { vp.content = base }, 500)
      })()
    </script>
    <meta name="description" content="zapclub.io — Drop in. Take the stage. Own the night. Real-time Nostr clubs with synchronized playback, shared curation, and Lightning zaps." />
    <title>zapclub.io — Drop in. Take the stage. Own the night.</title>

    <!-- Open Graph / Twitter card: the preview others see when the site is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="zapclub.io" />
    <meta property="og:url" content="https://zapclub.io/" />
    <meta property="og:title" content="zapclub.io — Drop in. Take the stage. Own the night." />
    <meta property="og:description" content="Open a club, build the set together, sync playback in real time, and zap the best DJ." />
    <meta property="og:image" content="https://zapclub.io/og.png" />
    <meta property="og:image:secure_url" content="https://zapclub.io/og.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1774" />
    <meta property="og:image:height" content="887" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="zapclub.io — Drop in. Take the stage. Own the night." />
    <meta name="twitter:description" content="Open a club, build the set together, sync playback in real time, and zap the best DJ." />
    <meta name="twitter:image" content="https://zapclub.io/og.png" />
    <meta name="twitter:image:alt" content="zapclub.io — Drop in. Take the stage. Own the night." />
    <meta property="og:image:alt" content="zapclub.io — Drop in. Take the stage. Own the night." />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
